[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fault-triage"
version = "0.1.0"
description = "Sorts Tesla vehicle fault messages from a CSV file by urgency."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/fault_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
